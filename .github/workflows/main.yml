name: Daily Run

permissions: write-all

on:
  schedule:
    # Backup only. GitHub's scheduler is best-effort and has been starting this
    # 3-8 hours late; the primary trigger is a cron-job.org job that calls the
    # workflow_dispatch API at 8:15 AM ET.
    - cron: '40 11 * * *'  # 11:40 UTC = 7:40 AM EDT / 6:40 AM EST
  workflow_dispatch:

# Never run two copies at once (avoids push conflicts between triggers)
concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  # Skip the late scheduled backup if today's run already happened
  check:
    runs-on: ubuntu-latest
    outputs:
      already_ran: ${{ steps.check.outputs.already_ran }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 20
    - id: check
      run: |
        TODAY=$(TZ=America/New_York date +"%m/%d/%Y")
        if git log -20 --format=%s | grep -qxF "run ($TODAY)"; then
          echo "already_ran=true" >> "$GITHUB_OUTPUT"
        else
          echo "already_ran=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.already_ran != 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'

    - name: Update system dependencies
      run: sudo apt-get update

    - name: Remove Chrome
      run: sudo apt purge google-chrome-stable

    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install ./google-chrome-stable_current_amd64.deb

    # Set up Chromedriver to match the installed version of Chrome
    - name: Setup Chromedriver
      uses: nanasess/setup-chromedriver@v2

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Run script
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      run: python run_scraper.py

    - name: Configure git
      run: |
        git config --global user.email "actions-user@users.noreply.github.com"
        git config --global user.name "GitHub Actions"

    - name: Commit changes
      run: |
        CURRENT_DATE=$(TZ=America/New_York date +"%m/%d/%Y")
        git add .
        git commit -m "run ($CURRENT_DATE)" -a || echo "No changes to commit"
        git pull --rebase
        git push
